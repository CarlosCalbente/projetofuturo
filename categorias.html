<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Permite acentos e caracteres especiais -->
    <meta charset="UTF-8">

    <!-- Faz a página adaptar-se ao tamanho da tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Nome da aba do navegador -->
    <title>Controle Financeiro</title>

    <!-- Liga o HTML ao CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================================= CONTEÚDO PRINCIPAL ================================= -->

    <main>

        <!-- ================================= SIDEBAR ================================= -->

        <nav id="sidebar">

            <p id="text">
                <img class="foto2" src="img/balanca.png" alt="Logo">
                Minhas Finanças
            </p>
            
            <div class="lista">

                <ul>
                    <li>
                        <a href="index.html">
                            <img
                                class="foto1"
                                src="img/casa1.png"
                                alt="Visão Geral"
                                onmouseover="this.src='img/casa2.png'"
                                onmouseout="this.src='img/casa1.png'"
                            >
                            Visão Geral
                        </a>
                    </li>


                    <li>
                        <a href="transacoes.html">
                            <img
                                class="foto1"
                                src="img/lista1.png"
                                alt="Transações"
                                onmouseover="this.src='img/lista2.png'"
                                onmouseout="this.src='img/lista1.png'"
                            >
                            Transações
                        </a>
                    </li>


                    <li>
                        <a href="categorias.html">
                            <img
                                class="foto1"
                                src="img/ticket1.png"
                                alt="Categorias"
                                onmouseover="this.src='img/ticket2.png'"
                                onmouseout="this.src='img/ticket1.png'"
                            >
                            Categorias
                        </a>
                    </li>


                    <li>
                        <a href="metas.html">
                            <img
                                class="foto1"
                                src="img/alvo1.png"
                                alt="Metas"
                                onmouseover="this.src='img/alvo2.png'"
                                onmouseout="this.src='img/alvo1.png'"
                            >
                            Metas
                        </a>
                    </li>


                    <li>
                        <a href="graficos.html">
                            <img
                                class="foto1"
                                src="img/grafico1.png"
                                alt="Gráficos"
                                onmouseover="this.src='img/grafico2.png'"
                                onmouseout="this.src='img/grafico1.png'"
                            >
                            Gráficos
                        </a>
                    </li>


                    <li>
                        <a href="configuracoes.html">
                            <img
                                class="foto1"
                                src="img/config1.png"
                                alt="Configurações"
                                onmouseover="this.src='img/config2.png'"
                                onmouseout="this.src='img/config1.png'"
                            >
                            Configurações
                        </a>
                    </li>
                </ul>
            </div>
        </nav>


        <!-- ============================= CONTEÚDO DA DIREITA ============================= -->

        <div id="conteudo">


            <!-- ================================= TOPO ================================= -->

            <div id="topo">
                <div>
                    <h1>Categorias</h1>
                    <p>
                        Organize e acompanhe suas categorias financeiras.
                    </p>
                </div>
            </div>


            <!-- ================================= CARDS ================================= -->

            <div class="card-categoria">

                <!-- TOTAL DE CATEGORIAS -->

                <div class="card-categorias">
                    <div class="iconeC">
                        <img
                            src="img/categorias.png"
                            alt="Total de categorias"
                        >
                    </div>
                    <div class="infoC">
                        <p>Total de categorias</p>
                        <p></p>
                        <p></p>
                    </div>
                </div>


                <!-- CATEGORIAS DE RECEITA -->

                <div class="card-categorias">
                    <div class="iconeC">
                        <img
                            src="img/receita-circulo.png"
                            alt="Categorias de receita"
                        >
                    </div>
                    <div class="infoC">
                        <p>Categorias de Receita</p>
                        <p></p>
                        <p></p>
                    </div>
                </div>


                <!-- CATEGORIAS DE DESPESA -->

                <div class="card-categorias">
                    <div class="iconeC">
                        <img
                            src="img/despesa-circulo.png"
                            alt="Categorias de despesa"
                        >
                    </div>
                    <div class="infoC">
                        <p>Categorias de Despesa</p>
                        <p></p>
                        <p></p>
                    </div>
                </div>
            </div>


            <!-- ============================== SUAS CATEGORIAS ============================== -->

            <div class="infocat">
                <h2>Suas Categorias</h2>
                <select id="filtro-categorias">
                    <option value="todas">
                        Todas as categorias
                    </option>
                    <option value="receita">
                        Receitas
                    </option>
                    <option value="despesa">
                        Despesas
                    </option>
                </select>
            </div>


            <!-- =========================== LISTA DE CATEGORIAS =========================== -->

            <div
                class="lista-categorias"
                id="lista-categorias"
            >
                <!--
                    As categorias serão adicionadas aqui dinamicamente pelo JavaScript
                -->
            </div>
        </div>
    </main>
</body>
</html>

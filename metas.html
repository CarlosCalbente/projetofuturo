<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Permite acentos e caracteres especiais -->
    <meta charset="UTF-8">

    <!-- Faz a página adaptar-se ao tamanho da tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Nome da aba do navegador -->
    <title>Controle Financeiro</title>

    <!-- Liga o HTML ao CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================================= CONTEÚDO PRINCIPAL ================================= -->

    <main>

        <!-- ================================= SIDEBAR ================================= -->

        <nav id="sidebar">

            <p id="text">
                <img class="foto2" src="img/balanca.png" alt="Logo">
                Minhas Finanças
            </p>

            <div class="lista">

                <ul>
                    <li>
                        <a href="index.html">
                            <img
                                class="foto1"
                                src="img/casa1.png"
                                alt="Visão Geral"
                                onmouseover="this.src='img/casa2.png'"
                                onmouseout="this.src='img/casa1.png'"
                            >
                            Visão Geral
                        </a>
                    </li>


                    <li>
                        <a href="transacoes.html">
                            <img
                                class="foto1"
                                src="img/lista1.png"
                                alt="Transações"
                                onmouseover="this.src='img/lista2.png'"
                                onmouseout="this.src='img/lista1.png'"
                            >
                            Transações
                        </a>
                    </li>


                    <li>
                        <a href="categorias.html">
                            <img
                                class="foto1"
                                src="img/ticket1.png"
                                alt="Categorias"
                                onmouseover="this.src='img/ticket2.png'"
                                onmouseout="this.src='img/ticket1.png'"
                            >
                            Categorias
                        </a>
                    </li>


                    <li>
                        <a href="metas.html">
                            <img
                                class="foto1"
                                src="img/alvo1.png"
                                alt="Metas"
                                onmouseover="this.src='img/alvo2.png'"
                                onmouseout="this.src='img/alvo1.png'"
                            >
                            Metas
                        </a>
                    </li>


                    <li>
                        <a href="graficos.html">
                            <img
                                class="foto1"
                                src="img/grafico1.png"
                                alt="Gráficos"
                                onmouseover="this.src='img/grafico2.png'"
                                onmouseout="this.src='img/grafico1.png'"
                            >
                            Relatórios
                        </a>
                    </li>


                    <li>
                        <a href="configuracoes.html">
                            <img
                                class="foto1"
                                src="img/config1.png"
                                alt="Configurações"
                                onmouseover="this.src='img/config2.png'"
                                onmouseout="this.src='img/config1.png'"
                            >
                            Configurações
                        </a>
                    </li>
                </ul>
            </div>
        </nav>


        <!-- ============================= CONTEÚDO DA DIREITA ============================= -->

        <div id="conteudo">


            <!-- ================================= TOPO ================================= -->

            <div id="topo">
                <div>
                    <h1>Metas Financeiras</h1>
                    <p>
                        Conquiste seus sonhos com planejamento financeiro.
                    </p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
